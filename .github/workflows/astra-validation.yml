name: Astra validation
on:
  push:
    branches: [astra]
  pull_request:
    branches: [main, astra]
permissions:
  contents: read
concurrency:
  group: astra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean dependency install
        id: install
        run: npm ci
      - name: Domain and image validation
        run: npm run test:unit
      - name: ESLint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint
      - name: TypeScript
        if: always() && steps.install.outcome == 'success'
        run: npm run typecheck
      - name: Production build (no deployment)
        if: always() && steps.install.outcome == 'success'
        env:
          GYMAF_REFERENCE_PREVIEW: '0'
        run: npm run build
      - name: Authentication HTTP contract
        run: npm run test:auth
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gymaf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gymaf_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap simulated provider context
        run: psql -v ON_ERROR_STOP=1 -f tests/db/bootstrap.sql
      - name: Bootstrap simulated storage metadata
        run: psql -v ON_ERROR_STOP=1 -f tests/db/storage-bootstrap.sql
      - name: Apply migrations and local-only seed helper
        run: |
          for file in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$file"; done
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Database ownership and history regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/db/coaching.sql
      - name: Member record privacy and persistence regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/db/member-records.sql
      - name: Training library privacy and persistence regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/db/training-library.sql
      - name: Workout feedback privacy and submission regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/db/session-feedback.sql
      - name: Private media ownership and lifecycle regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/db/member-media.sql
      - name: Private account and interest regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/db/account-details.sql
      - name: Private coach rating regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/db/coach-rating.sql
      - name: Coach directory visibility and ownership regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/db/coach-directory.sql
      - name: Private shipping address regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/db/shipping-address.sql
